<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パワラジフォーマット キャプチャ</title>
  <link rel="stylesheet" href="./css/reset.css?v=41">
  <link rel="stylesheet" href="./css/capture.css?v=41">
  <link id="template-stylesheet" rel="stylesheet" href="./templates/clean/clean.css?v=41">
</head>
<body class="capture-page">
  <div id="capture-controls" class="capture-controls" aria-label="キャプチャ操作">
    <div class="capture-controls__group">
      <button id="capture-prev" type="button" title="前のお便り (←)">←</button>
      <span id="capture-position" class="capture-controls__position">— / —</span>
      <button id="capture-next" type="button" title="次のお便り (→)">→</button>
    </div>
    <div class="capture-controls__group">
      <button id="capture-scroll-up" type="button" title="本文を上へ (↑)">↑</button>
      <button id="capture-scroll-down" type="button" title="本文を下へ (↓)">↓</button>
      <button id="capture-scroll-home" type="button" title="本文の先頭 (Home)">先頭</button>
    </div>
    <div class="capture-controls__group">
      <button id="capture-refresh" type="button" title="回答を更新 (R)">↻ 更新</button>
      <span id="capture-refresh-state" class="capture-controls__status">—</span>
    </div>
  </div>

  <main class="capture-shell" aria-live="polite">
    <div id="capture-status" class="capture-status" hidden></div>
    <div id="capture-preview" class="template-host">
      <article class="template-root" data-template="clean">
        <header class="template-name-wrap"><p class="template-label" aria-hidden="true">MESSAGE FROM</p><h1 class="response-name"></h1></header>
        <div class="template-divider" aria-hidden="true"></div>
        <div class="response-content" tabindex="0"></div>
      </article>
    </div>
  </main>
  <script type="module" src="./js/capture.js?v=41"></script>
</body>
</html>
